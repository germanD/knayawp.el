name: Probe suite

on:
  push:
    branches: [main]
  workflow_dispatch:
    paths:
      - 'knayawp.el'
      - 'test/**'
      - 'kb/**'
      - '.github/workflows/probes.yml'
  pull_request:
    paths:
      - 'knayawp.el'
      - 'test/**'
      - 'kb/**'
      - '.github/workflows/probes.yml'

jobs:
  ert:
    name: ERT unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Emacs
        run: sudo apt-get update && sudo apt-get install -y emacs
      - name: Byte-compile
        run: emacs -batch -f batch-byte-compile knayawp.el
      - name: Checkdoc
        run: emacs -batch -l knayawp.el --eval '(checkdoc-file "knayawp.el")'
      - name: ERT
        run: emacs -batch -l ert -l knayawp.el -l test/knayawp-test.el -f ert-run-tests-batch-and-exit

  probes:
    needs: ert
    name: Integration probes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TERM: xterm-256color
      KNAYAWP_PROBE_GEOM: 200x50
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          # Build tools for vterm native module; elpa-vterm/magit/with-editor as fast-path
          # fallbacks (not available on all Ubuntu images, hence || true).
          sudo apt-get install -y emacs tmux \
            build-essential cmake libtool libtool-bin automake pkg-config \
            elpa-magit elpa-with-editor elpa-vterm || true
      - name: Tool versions
        run: |
          emacs --version
          git --version
          tmux -V
      - name: Cache ELPA packages
        id: elpa-cache
        uses: actions/cache@v4
        with:
          path: ~/.emacs.d/elpa
          # Key on sandbox.el only — knayawp.el changes don't affect package versions.
          key: elpa-${{ hashFiles('test/sandbox.el', '.github/workflows/probes.yml', 'test/bootstrap-elpa.sh') }}
          restore-keys: |
            elpa-
      - name: Bootstrap ELPA packages
        if: steps.elpa-cache.outputs.cache-hit != 'true'
        run: bash test/bootstrap-elpa.sh
      - name: ELPA sanity check
        run: |
          emacs -Q --batch \
            --eval "(progn \
              (require 'package) \
              (add-to-list 'package-archives \
                '(\"melpa\" . \"https://melpa.org/packages/\")) \
              (package-initialize))" \
            --eval "(require 'magit)" \
            --eval "(or (locate-library \"vterm\") (error \"vterm not in load-path\"))" \
            --eval "(require 'with-editor)" \
            --eval "(require 'eat)" \
            --eval "(message \"ELPA sanity: OK\")"
      - name: Run probe suite
        run: bash test/run-probes.sh
